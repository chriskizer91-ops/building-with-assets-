<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0a16">
<title>Mooncart</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="art" aria-hidden="true"></canvas>
<main id="screen" aria-label="Game screen">
  <div id="stage"></div>
  <div id="select" class="layer" hidden></div>
  <div id="loading" class="layer" hidden></div>
  <div id="overlay" class="layer" hidden></div>
  <div id="boot" class="layer" hidden></div>
  <div id="flash" aria-hidden="true"></div>
</main>
<div id="pads" aria-hidden="true"></div>
<div id="library" class="library" hidden></div>
<div id="modal-root"></div>
<div id="toast" role="status" hidden></div>
<script type="module" src="js/main.js"></script>
<script>
  // If the phone's web engine is too old to run the console, say so instead of showing nothing.
  setTimeout(function () {
    if (document.documentElement.getAttribute('data-started')) return;
    var p = document.createElement('div');
    p.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b0a16;color:#ece6ff;font:16px/1.5 sans-serif;text-align:center';
    p.innerHTML = '<div><p style="font-size:20px">Mooncart can\'t start on this phone yet.</p><p>Its web engine is too old. Connect to the internet once, open the Play Store and update <b>Android System WebView</b> (or <b>Chrome</b>), then open Mooncart again. After that it works offline.</p></div>';
    document.body.appendChild(p);
  }, 6000);
</script>
</body>
</html>
